name: Compilar APK de Toma de Pedidos
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java (necesario para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar el proyecto Android con la app web
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK (versión de prueba, sin firma especial)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar el APK como "Release" descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Toma de Pedidos — build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK generado automáticamente desde el código actual.
            Descárgalo en el celular y ábrelo para instalarlo
            (activando "instalar de fuentes desconocidas" si el celular lo pide).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
